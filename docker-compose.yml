services:
  web:
    build: ./Frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - internal

  api:
    build: ./Backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: mpanolo_user
      DB_PASSWORD: mpanolo_pass
      DB_NAME: L3_L2_L1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change_me
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: L3_L2_L1
      MYSQL_USER: mpanolo_user
      MYSQL_PASSWORD: mpanolo_pass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    networks:
      - internal

networks:
  internal:
    driver: bridge